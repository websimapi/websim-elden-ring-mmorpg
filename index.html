<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elden Ring MMORPG</title>
    <link rel="stylesheet" href="styles.css">
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.158.0/examples/jsm/",
            "nipplejs": "https://esm.sh/nipplejs"
        }
    }
    </script>
</head>
<body>
    <div id="ui-container">
        <div id="host-panel">
            <h3>Host Control Panel</h3>
            <button id="become-host">Become Host</button>
            <button id="leave-host" style="display: none;">Leave Host</button>
            <div id="host-status">Not hosting</div>
            <div id="host-key-display" style="display: none;">
                <p>Public Key: <span id="public-key"></span></p>
                <p>Players: <span id="player-count">0</span></p>
            </div>
        </div>
        
        <div id="game-info">
            <div id="position-display">Position: (0, 0, 0)</div>
            <div id="connection-status">Connecting...</div>
        </div>
        
        <div id="mobile-controls" style="display: none;">
            <div id="movement-joystick"></div>
            <div id="camera-joystick"></div>
        </div>
    </div>

    <div id="loading-screen">
        <div class="loading-content">
            <h2>Loading Elden Ring MMORPG</h2>
            <div class="loading-spinner"></div>
            <p>Initializing terrain and connecting to realm...</p>
        </div>
    </div>

    <canvas id="game-canvas"></canvas>

    <script type="module" src="crypto-utils.js"></script>
    <script type="module" src="terrain.js"></script>
    <script type="module" src="character.js"></script>
    <script type="module" src="host.js"></script>
    <script type="module" src="game.js"></script>
<script defer src="https://static.cloudflareinsights.com/beacon.min.js/v8c78df7c7c0f484497ecbca7046644da1771523124516" integrity="sha512-8DS7rgIrAmghBFwoOTujcf6D9rXvH8xm8JQ1Ja01h9QX8EzXldiszufYa4IFfKdLUKTTrnSFXLDkUEOTrZQ8Qg==" data-cf-beacon='{"version":"2024.11.0","token":"4c6229722a6346bc8eb5cb0e5eae5d41","server_timing":{"name":{"cfCacheStatus":true,"cfEdge":true,"cfExtPri":true,"cfL4":true,"cfOrigin":true,"cfSpeedBrain":true},"location_startswith":null}}' crossorigin="anonymous"></script>
</body>
</html>
